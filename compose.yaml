services:
  commitgym:
    build: .
    ports:
      - "127.0.0.1:8080:8000"
    env_file:
      - path: .env
        required: false
    environment:
      COMMITGYM_DB: /app/data/commitgym.sqlite3
      COMMITGYM_PUBLIC: ${COMMITGYM_PUBLIC:-false}
    volumes:
      - commitgym-data:/app/data
    restart: unless-stopped
volumes:
  commitgym-data:

# Render Blueprint for CommitGym: one Docker web service serving the API and the built SPA on one origin.
# Free instances have no persistent disk: SQLite episode history resets on every redeploy or restart.
services:
  - type: web
    runtime: docker
    name: commitgym
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: COMMITGYM_DB
        value: /app/data/commitgym.sqlite3
      # Public mode protects /api/* (except health) with a bearer token; viewers enter it in Settings.
      # For an open demo set COMMITGYM_PUBLIC=false and delete the token; live model use is then capped only by LLM_MAX_REQUESTS.
      - key: COMMITGYM_PUBLIC
        value: "true"
      - key: COMMITGYM_ACCESS_TOKEN
        generateValue: true
      - key: LLM_PROVIDER
        value: openrouter
      - key: OPENROUTER_MODEL
        value: nvidia/nemotron-3.5-lightning:free
      - key: LLM_MAX_REQUESTS
        value: "60"
      - key: LLM_MAX_OUTPUT_TOKENS
        value: "1024"
      - key: OPENROUTER_API_KEY
        sync: false

# Render Blueprint for CommitGym: one Docker web service serving the API and the built SPA on one origin.
# Free instances have no persistent disk: SQLite episode history resets on every redeploy or restart.
services:
  - type: web
    runtime: docker
    name: commitgym
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: COMMITGYM_DB
        value: /app/data/commitgym.sqlite3
      # Public mode protects /api/* (except health) with a bearer token; viewers enter it in Settings.
      # Set COMMITGYM_PUBLIC=false and remove the token only for an open demo with LLM_ENABLED=false.
      - key: COMMITGYM_PUBLIC
        value: "true"
      - key: COMMITGYM_ACCESS_TOKEN
        generateValue: true
      - key: LLM_ENABLED
        value: "true"
      - key: LLM_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: LLM_MODEL
        value: nvidia/nemotron-3.5-lightning:free
      - key: LLM_MAX_REQUESTS
        value: "20"
      - key: LLM_API_KEY
        sync: false
